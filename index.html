<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="robots" content="noindex">
<title>ORBIT に移りました</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1f2a44;color:#f6f5f2;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:28px;letter-spacing:.12em;margin:0 0 12px}
p{font-size:15px;line-height:1.7;color:#c9d3e6;margin:0 0 18px}
a{display:inline-block;background:#2a78d6;color:#fff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:12px}
</style>
</head>
<body>
<main>
<h1>ORBIT</h1>
<p>新しいURLに移りました。<br>入れたデータはそのまま使えます。<br>ホーム画面のアイコンは、新しいURLで追加し直してください。</p>
<a href="https://sengokueru.github.io/orbit/">新しいURLで開く</a>
</main>
<script>
// 古い版のオフライン用の仕組みとキャッシュを外してから、新しいURLへ移る（データの localStorage には触らない）
(async () => {
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope.endsWith('/eigyo-note/')) await r.unregister();
    if (window.caches) { const pre = 'eigyo-' + encodeURIComponent(location.origin + '/eigyo-note/') + '-'; for (const k of await caches.keys()) if (k.startsWith(pre)) await caches.delete(k); }
  } catch (_) { /* 外せなくても移る */ }
  location.replace('https://sengokueru.github.io/orbit/');
})();
</script>
</body>
</html>
